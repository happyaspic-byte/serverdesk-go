name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, race, coverage, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt check failed:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet Go packages
        run: go vet ./...
      - name: Verify stdlib-only dependency boundary
        shell: bash
        run: |
          modules=$(go list -m all | wc -l)
          test "$modules" -eq 1
      - name: Verify workflow and secret hygiene
        shell: bash
        run: |
          refs=$(grep -R -n -E --include='*.yml' 'uses:[[:space:]]+[^[:space:]]+@' .github/workflows || true)
          if printf '%s\n' "$refs" | grep -v -E '@[0-9a-f]{40}([[:space:]]|$)'; then
            echo 'Workflow actions must be pinned to an exact 40-character commit SHA.' >&2
            exit 1
          fi
          if git grep -n -E 'BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY' -- ':!docs/mibs/**'; then
            echo 'Private-key material is forbidden in the repository.' >&2
            exit 1
          fi
      - name: Run Go tests with race detector and coverage
        run: go test -shuffle=on -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce 80 percent Go statement coverage
        shell: bash
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Go statement coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 80) exit 1 }'
      - name: Run JavaScript model tests
        run: node --test web/tests/*.test.mjs
      - name: Build Linux and Windows binaries
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/serverdesk-linux ./cmd/serverdesk
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/serverdesk-windows.exe ./cmd/serverdesk
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -exec=/bin/true ./...
      - name: Parse PowerShell deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/packaging/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("{0}: {1}" -f $_.Name, ($errors -join '; '))
            }
          }
          if ($failed) { exit 1 }
      - name: Validate deployment assets
        run: sh deploy/packaging/validate-deployment.sh

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
