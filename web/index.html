<!-- CSS 전에 저장된 명시 테마를 찍고, browser chrome도 선택된 테마와 같은 값으로 유지한다.
     system은 data-theme 속성 부재이며 OS 변경을 계속 따른다. -->
<script>
(function () {
  var root = document.documentElement;
  var chrome = document.getElementById('theme-color');
  var media = window.matchMedia('(prefers-color-scheme: dark)');
  try {
    var stored = localStorage.getItem('sd.theme');
    if (stored === 'light' || stored === 'dark') root.setAttribute('data-theme', stored);
  } catch (e) { /* noop */ }

  function syncThemeColor() {
    var selected = root.getAttribute('data-theme');
    var dark = selected === 'dark' || (selected !== 'light' && media.matches);
    chrome.setAttribute('content', dark ? '#171310' : '#F1EDE4');
  }

  syncThemeColor();
  media.addEventListener('change', syncThemeColor);
  new MutationObserver(syncThemeColor).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
}());
</script>

    <!-- 실시간 상태 안내용 공용 라이브 리전 — id: sd-live. app.js 가 announce(text) 시 이 요소의
         textContent 를 갱신해 스크린리더에 상태 변화를 알린다(스크린리더 전용, 시각적으로 숨김). -->
    <div id="sd-live" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"></div>

    </span>
    <span data-field="toastText"></span>
  </div>
